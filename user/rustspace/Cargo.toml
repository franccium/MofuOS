[workspace]

[package]
name = "rustspace"
version = "0.1.0"
edition = "2024"

[lib]
name = "rustspace"
path = "src/lib.rs"

[[bin]]
name = "rust_first"
path = "src/bin/rust_first.rs"

[[bin]]
name = "game"
path = "src/bin/game.rs"

[[bin]]
name = "theophe"
path = "src/bin/theophe.rs"

[[bin]]
name = "fs_test"
path = "src/bin/fs_test.rs"

[dependencies]
x86_64 = "0.15.2"
pc-keyboard = "0.8.0"
spin = "0.10.0"
embedded-graphics = "0.8.2"
bitflags = "2.11.0"
static_assertions = "1.1.0"
micromath = { version = "2.1.0", default-features = false }